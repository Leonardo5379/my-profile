<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎃 My Personal Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            
            background: linear-gradient(135deg, #1a0b2e 0%, #0f0517 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before, body::after {
            content: "🎃";
            position: fixed;
            font-size: 40px;
            opacity: 0.15;
            z-index: 0;
        }
        body::before {
            top: 10%;
            left: 5%;
            animation: float 6s ease-in-out infinite;
        }
        body::after {
            content: "👻";
            bottom: 15%;
            right: 8%;
            font-size: 50px;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .avatar-wrap {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 24px;
            animation: wiggle 3s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff7518;
            box-shadow: 0 0 20px rgba(255, 117, 24, 0.4);
        }

        .avatar-wrap::after {
            content: "🎃";
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 32px;
        }

        .status {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 20px;
            height: 20px;
            background-color: #ff7518;
            border-radius: 50%;
            border: 3px solid #1a0b2e;
        }

        .nickname {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffb347;
            text-shadow: 0 0 10px rgba(255, 117, 24, 0.5);
        }

        .bio {
            font-size: 15px;
            color: #d4c5e0;
            line-height: 1.6;
            margin-bottom: 24px;
            padding: 0 20px;
        }

        .info-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .info-item {
            font-size: 14px;
            color: #b8a9c9;
        }

        .info-item strong {
            color: #ff7518; 
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
            padding: 0 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px;
            background-color: rgba(255, 117, 24, 0.15);
            color: #ffb347;
            text-decoration: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid rgba(255, 117, 24, 0.3);
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: rgba(255, 117, 24, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 117, 24, 0.2);
        }

        .tags {
            margin-bottom: 32px;
            padding: 0 20px;
        }

        .tag {
            display: inline-block;
            padding: 6px 14px;
            background-color: rgba(124, 58, 237, 0.2);
            color: #d8b4fe;
            border: 1px solid rgba(124, 58, 237, 0.3);
            border-radius: 20px;
            font-size: 13px;
            margin: 4px;
        }

        .showcase-card {
            margin: 0 20px 40px;
            background-color: rgba(45, 27, 78, 0.6);
            border: 1px solid rgba(255, 117, 24, 0.2);
            border-radius: 16px;
            overflow: hidden;
            text-align: left;
            backdrop-filter: blur(10px);
        }

        .showcase-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .showcase-info {
            padding: 16px;
        }

        .showcase-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #ffb347;
        }

        .showcase-desc {
            font-size: 14px;
            color: #c4b5d6;
        }

        .footer {
            font-size: 12px;
            color: #7c6f8c;
            margin-top: 40px;
        }
    </style>
</head>
<body>
  
    <div class="container">
        <div class="avatar-wrap">
            <img src="https://raw.githubusercontent.com/Leonardo5379/my-personal-profile016/refs/heads/main/avatar.jpg" alt="My avatar" class="avatar">
            <div class="status"></div>
        </div>

        <h1 class="nickname">👻 zhengyich016 🎃</h1>

        <div class="info-row">
            <div class="info-item">Status <strong>Offline</strong></div>

        <div class="btn-group">
            <a href="https://www.roblox.com/users/4151968698/profile" class="btn" target="_blank">
                My Roblox account
            </a>
            <a href="https://discord.com/users/1082284481014145034" class="btn" target="_blank">
                My Discord account
       </div>
        
        <div class="tags">
            <span class="tag">Game development</span>
            <span class="tag">Website development</span>
        </div>
        
        <div class="footer">
            Made with 🎃 by zhengyich016 | HAPPY HALLOWEEN 2026
        </div>
    </div>
</body>
</html>
